name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'

env:
  REGISTRY: ghcr.io

jobs:
  # Build AMD64 image natively
  build-amd64:
    name: Build Docker Image (AMD64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Retry on transient registry timeouts pulling the buildkit builder image
      # (e.g. "net/http: request canceled while waiting for connection" against
      # registry-1.docker.io). See bd-n6197: run 30144328147 failed here on a
      # one-off Docker Hub blip while the build/push jobs on the same commit
      # succeeded. docker/setup-buildx-action has no built-in retry input, so
      # this duplicates the step with continue-on-error, matching the
      # build-push-action retry pattern used elsewhere in this file.
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        continue-on-error: true

      - name: Wait before Buildx retry
        if: steps.buildx.outcome == 'failure'
        run: |
          echo "::warning::Docker Buildx setup failed (likely transient registry timeout pulling the buildkit image). Sleeping 15s before retry."
          sleep 15

      - name: Set up Docker Buildx — retry
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v4

      # Retry on transient registry-connect timeouts (bd-n6197), mirroring the
      # Buildx-setup retry above and the build-push-action retry pattern.
      - name: Log in to Container Registry
        id: login
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait before registry login retry
        if: github.event_name != 'pull_request' && steps.login.outcome == 'failure'
        run: |
          echo "::warning::Container registry login failed (likely transient network timeout). Sleeping 15s before retry."
          sleep 15

      - name: Log in to Container Registry — retry
        if: github.event_name != 'pull_request' && steps.login.outcome == 'failure'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}

      - name: Extract version and set release channel
        id: version
        run: |
          VERSION=$(jq -r '.version' frontend/package.json)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "channel=latest" >> $GITHUB_OUTPUT

      # Build + push with 2 retries on transient GHCR 50x during layer blob push.
      # See bd-42aai: GHCR returned 502/504 with
      # "error writing layer blob: failed to parse error response 50x" in a
      # 30min window across 4 jobs, each needing manual rerun. Retries are
      # scoped to this step only; build cache is reused across attempts.
      - name: Build and push (AMD64)
        id: build
        uses: docker/build-push-action@v7
        continue-on-error: true
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            ECM_VERSION=${{ steps.version.outputs.version }}
            RELEASE_CHANNEL=${{ steps.version.outputs.channel }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Wait before retry 1 (AMD64)
        if: steps.build.outcome == 'failure'
        run: |
          echo "::warning::Build/push attempt 1 failed (likely transient GHCR 50x). Sleeping 30s before retry."
          sleep 30

      - name: Build and push (AMD64) — retry 1
        id: build_retry1
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        continue-on-error: true
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            ECM_VERSION=${{ steps.version.outputs.version }}
            RELEASE_CHANNEL=${{ steps.version.outputs.channel }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Wait before retry 2 (AMD64)
        if: steps.build.outcome == 'failure' && steps.build_retry1.outcome == 'failure'
        run: |
          echo "::warning::Build/push attempt 2 failed. Sleeping 60s before final retry."
          sleep 60

      - name: Build and push (AMD64) — retry 2
        id: build_retry2
        if: steps.build.outcome == 'failure' && steps.build_retry1.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            ECM_VERSION=${{ steps.version.outputs.version }}
            RELEASE_CHANNEL=${{ steps.version.outputs.channel }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Capture digest (AMD64)
        id: digest
        run: |
          # Pick the digest from whichever attempt actually succeeded.
          DIGEST="${{ steps.build.outputs.digest }}"
          if [ -z "$DIGEST" ]; then DIGEST="${{ steps.build_retry1.outputs.digest }}"; fi
          if [ -z "$DIGEST" ]; then DIGEST="${{ steps.build_retry2.outputs.digest }}"; fi
          if [ -z "$DIGEST" ]; then
            echo "::error::No digest produced by any build attempt"
            exit 1
          fi
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

  # Build ARM64 image natively on ARM runner (avoids QEMU emulation issues)
